<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact | Chase Pittman</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/assets/logos/personal/favicon.ico">
<link rel="stylesheet" href="/css/global.css">
<script>
  (function() {
    if (localStorage.getItem('cp-theme') === 'light')
      document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<style>

.page-wrapper { transition: transform 0.3s ease; min-height: 100vh; }

.content {
  max-width: 720px; margin: 90px auto;
  padding: 0 20px; text-align: center;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 44px; margin-bottom: 10px;
  color: var(--text-primary);
}

.subtitle { color: var(--text-secondary); font-size: 17px; margin-bottom: 50px; }

/* ── 3D BUSINESS CARD ── */
.floating-card-container {
  margin: 40px auto 60px auto; perspective: 1000px;
  display: flex; justify-content: center;
}
.floating-card {
  width: 380px; aspect-ratio: 3.5 / 2;
  position: relative; transform-style: preserve-3d;
  cursor: pointer; transform-origin: center center;
}
.floating-card img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border-radius: 12px; backface-visibility: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
.card-back { transform: rotateY(180deg); }

/* ── CONTACT CARD ── */
.contact-card {
  background: var(--card-bg); padding: 40px; border-radius: 14px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid transparent; transition: background .3s ease, border-color .3s ease;
}
[data-theme="light"] .contact-card {
  border-color: rgba(255,255,255,0.6);
  box-shadow: 0 4px 24px rgba(100,140,160,.10);
}

form { display: grid; gap: 16px; }

input, textarea {
  background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.12);
  border-radius: 6px; padding: 12px;
  color: var(--text-primary);
  font-family: 'Poppins', sans-serif; font-size: 14px;
  transition: background .3s, border-color .3s, color .3s;
}
[data-theme="light"] input,
[data-theme="light"] textarea {
  background: rgba(255,255,255,.6);
  border-color: rgba(0,0,0,.15);
}
input::placeholder, textarea::placeholder { color: var(--text-secondary); }
textarea { resize: vertical; min-height: 120px; }

input:focus, textarea:focus {
  outline: none;
  border-color: var(--gold-border);
  background: rgba(194,164,109,.06);
}

/* Submit button — gold to match the rest of the site */
.submit-btn {
  background: var(--gold-dim);
  border: 1px solid var(--gold-border);
  color: var(--gold);
  padding: 12px; border-radius: 6px;
  font-family: 'Poppins', sans-serif; font-size: 14px;
  cursor: pointer; letter-spacing: .04em;
  transition: background .25s, border-color .25s, transform .2s;
}
.submit-btn:hover {
  background: rgba(194,164,109,.22);
  border-color: rgba(194,164,109,.6);
  transform: translateY(-1px);
}

/* ── CONTACT ICONS ── */
.contact-icons {
  margin-top: 28px; display: flex;
  justify-content: center; gap: 26px;
}
.contact-icons img {
  width: 26px; height: auto; opacity: 0.85;
  transition: opacity 0.2s, transform 0.2s;
}
.contact-icons a:hover img { opacity: 1; transform: translateY(-2px); }
[data-theme="light"] .contact-icons img { filter: invert(1) sepia(1) saturate(0) brightness(0.3); }
[data-theme="light"] .contact-icons a:hover img { filter: invert(1) sepia(1) saturate(2) hue-rotate(5deg) brightness(0.55); }

</style>
</head>
<body>

<div id="sidebar-placeholder"></div>
<div id="navbar-placeholder"></div>

<div class="page-wrapper" id="page-wrapper">
  <div class="content">

    <h1>Contact</h1>
    <div class="subtitle">Interested in product, design, or collaboration? Send a note below.</div>

    <div class="floating-card-container" id="floating-card-container">
      <div class="floating-card" id="floating-card">
        <img class="card-front" src="/assets/logos/personal/business_card.png" alt="Front of Business Card">
        <img class="card-back"  src="/assets/logos/personal/business_card_back.png" alt="Back of Business Card">
      </div>
    </div>

    <div class="contact-card">
      <form action="https://formspree.io/f/mqebzonn" method="POST">
        <input type="text"  name="name"    placeholder="Name"    required>
        <input type="email" name="email"   placeholder="Email"   required>
        <textarea           name="message" placeholder="Message" required></textarea>
        <button type="submit" class="submit-btn">Send Message</button>
      </form>

      <div class="contact-icons">
        <a href="https://www.linkedin.com/in/chasepittman" target="_blank"><img src="/assets/logos/tools/linkedin.png" alt="LinkedIn"></a>
        <a href="https://www.credly.com/users/chase-pittman.017d3434/badges#credly" target="_blank"><img src="/assets/logos/skills/credly.png" alt="Credly"></a>
        <a href="https://www.github.com/chasepittman" target="_blank"><img src="/assets/logos/tools/github.png" alt="GitHub"></a>
        <a href="/contact.html"><img src="/assets/logos/tools/gmail.png" alt="Contact Form"></a>
      </div>
    </div>

  </div>
</div>

<div id="theme-toggle-placeholder"></div>
<div id="spotify-placeholder"></div>

<script src="/js/components.js"></script>
<script>
  // ── 3D spinning business card ──────────────────────────────
  const card          = document.getElementById('floating-card');
  const cardContainer = document.getElementById('floating-card-container');

  let rotation = 0, tiltX = 0, tiltY = 0, targetTiltX = 0, targetTiltY = 0;

  function spinCard() {
    const angle = rotation % 360;
    const distanceFromFront = Math.min(Math.abs(angle), Math.abs(360 - angle));
    const distanceFromBack  = Math.min(Math.abs(angle - 180), Math.abs(180 - angle));
    const minDistance = Math.min(distanceFromFront, distanceFromBack);
    const normalized  = Math.min(minDistance, 90) / 90;
    const speed = 0.05 + normalized * 1.15;
    rotation += speed;

    const damping = 0.1;
    tiltX += (targetTiltX - tiltX) * damping;
    tiltY += (targetTiltY - tiltY) * damping;

    const floatOffset = Math.sin(rotation * 0.02) * 8;
    card.style.transform =
      `translateY(${floatOffset}px) rotateX(${tiltX}deg) rotateY(${rotation + tiltY}deg)`;

    requestAnimationFrame(spinCard);
  }

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) spinCard();

  if (window.matchMedia('(hover: hover)').matches) {
    card.addEventListener('mousemove', e => {
      const rect    = card.getBoundingClientRect();
      const centerX = rect.width  / 2;
      const centerY = rect.height / 2;
      targetTiltX   = -((e.clientY - rect.top  - centerY) / centerY) * 10;
      targetTiltY   =  ((e.clientX - rect.left - centerX) / centerX) * 10;
    });
    card.addEventListener('mouseleave', () => { targetTiltX = 0; targetTiltY = 0; });
  }
</script>
</body>
</html>
